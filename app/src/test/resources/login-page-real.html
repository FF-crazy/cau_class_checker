<script language="javascript"type="text/javascript">
/**
 * 通过分割字符串获取查询参数
 * @param {string} name - 参数名
 * @returns {string|null}
 */
function getQueryParamLegacy(name) {
    // 获取问号后面的部分，如果没有问号则返回空字符串
    var query = window.location.search.substring(1);
    if (!query) return null;

    // 将参数对按 & 分割
    var pairs = query.split("&");
    
    for (var i = 0; i < pairs.length; i++) {
        var pair = pairs[i].split("=");
        // 确保键名匹配（注意解码键名以防万一）
        if (decodeURIComponent(pair[0]) === name) {
            // 返回解码后的值，将 + 号替换为空格（处理 application/x-www-form-urlencoded 编码）
            return pair[1] ? decodeURIComponent(pair[1].replace(/\+/g, " ")) : "";
        }
    }
    
    return null;
}

// 使用示例
var lang = getQueryParamLegacy("locale");
console.log(lang);
if(lang==='en'){
	$('html').attr('lang','en')
}else{
	$('html').attr('lang','zh-cn')
}
$("#change_language").unbind("click").click(function(){
    var re=eval('/(locale=)([^&]*)/gi');
    var url = window.location.href;
    if($("#change_language").attr("value") != "English"){
       if(url.indexOf("locale") >= 0 ) {
          url=url.replace(re,'locale=zh_CN');
          location.href=url;
       }else{
          if(url.indexOf("?") >= 0){
             location.href=url+"&locale=zh_CN";
          }else{
             location.href=url+"?locale=zh_CN";
          }
       }
       
    }else if($("#change_language").attr("value") == "English") {
       if(url.indexOf("locale") >= 0 ) {
          url=url.replace(re,'locale=en');
          location.href=url;
       }else{
          if(url.indexOf("?") >= 0){
             location.href=url+"&locale=en";
          }else{
             location.href=url+"?locale=en";
          }
       }
       
    }
});
</script>
